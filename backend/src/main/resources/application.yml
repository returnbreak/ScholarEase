server:
  port: 8080

spring:
  ssl:
    bundle:
      pem:
        elasticsearch:
          truststore:
            certificate: ${ELASTICSEARCH_CA_CERT:file:D:/elasticsearch-8.10.0/config/certs/http_ca.crt}

  datasource:
    url: jdbc:mysql://localhost:3306/scholarease?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123ksf123.
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  data:
    redis:
      host: localhost
      port: 6379
      password: 123456

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:https://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:elastic}
    password: ${ELASTICSEARCH_PASSWORD:sz6ubmhMscjkqefxgOCz}
    restclient:
      ssl:
        bundle: ${ELASTICSEARCH_SSL_BUNDLE:elasticsearch}

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    consumer:
      group-id: paper-vector-index-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.kesf.backend.kafka
        spring.json.value.default.type: com.kesf.backend.kafka.PaperVectorIndexTask
    listener:
      ack-mode: record

scholarease:
  kafka:
    consumerGroup: paper-vector-index-group
    paperVectorIndexPartitions: 1
    paperVectorIndexReplicas: 1
    topics:
      paperVectorIndex: paper-vector-index-topic
  qa:
    enabled: true
    chat:
      baseUrl: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      apiKey: ${DEEPSEEK_API_KEY:${QA_STREAMING_CHAT_API_KEY:}}
      modelName: ${DEEPSEEK_MODEL_NAME:deepseek-v4-pro}
      temperature: ${DEEPSEEK_TEMPERATURE:${QA_STREAMING_CHAT_TEMPERATURE:0.2}}
      topP: ${DEEPSEEK_TOP_P:0.9}
      timeoutSeconds: ${DEEPSEEK_TIMEOUT_SECONDS:60}
      modelMaxTokens:
        deepseek-v4-pro: ${DEEPSEEK_V4_PRO_MAX_TOKENS:8192}
        deepseek-v4-flash: ${DEEPSEEK_V4_FLASH_MAX_TOKENS:4096}
    historyRecentTurns: ${QA_HISTORY_RECENT_TURNS:20}
    redisSessionTtlDays: ${QA_REDIS_SESSION_TTL_DAYS:30}
    vectorTopK: ${QA_VECTOR_TOP_K:40}
    vectorNumCandidates: ${QA_VECTOR_NUM_CANDIDATES:200}
    bm25TopK: ${QA_BM25_TOP_K:40}
    rrfK: ${QA_RRF_K:60}
    mergedTopK: ${QA_MERGED_TOP_K:60}
    rerankInputTopK: ${QA_RERANK_INPUT_TOP_K:60}
    rerankOutputTopK: ${QA_RERANK_OUTPUT_TOP_K:10}
    finalContextMinChunks: ${QA_FINAL_CONTEXT_MIN_CHUNKS:4}
    finalContextMaxChunks: ${QA_FINAL_CONTEXT_MAX_CHUNKS:8}
    prompts:
      rewritePrompt: |
        你是 ScholarEase 的论文检索 query rewrite 模块。
        用户会用中文询问英文论文内容。请把问题改写为适合 Elasticsearch BM25 检索的英文 query。
        要求：
        1. 保留模型名、方法名、数据集名、指标名、公式符号等专有名词。
        2. 不要引入用户问题中不存在的论文事实。
        3. 只输出 JSON，不要 Markdown，不要解释。

        JSON schema:
        {
          "standaloneQuestionZh": "中文独立问题",
          "queryEn": "English retrieval query",
          "bm25Keywords": ["keyword"],
          "exactTerms": ["exact term"]
        }

        用户问题：
        {message}
      groundedUserMessage: |
        用户问题：
        {message}

        检索证据：
        {evidence}

        请只依据上述证据用中文回答。每个关键结论后标注证据编号，例如 [S1]。
        回答必须使用 Markdown 格式输出，以便前端正确渲染标题、列表、表格、公式和代码块。
        如果证据不足，明确说明“当前检索到的证据不足以回答”。
      systemPrompt: |
        你是 ScholarEase 的论文问答助手。
        只能依据给定 evidence 回答，不允许编造论文事实。
        使用中文回答。
        使用 Markdown 格式组织回答，必要时使用标题、列表、表格、公式或代码块。
        每个关键结论后必须引用证据编号。
        不要输出没有来源的论文结论。

mineru:
  enabled: true
  baseUrl: https://mineru.net
  token: ${MINERU_TOKEN:}
  modelVersion: vlm
  sourceFile:
    mode: mineru-signed-upload
  api:
    fileUrlsBatchPath: /api/v4/file-urls/batch
    batchResultsPath: /api/v4/extract-results/batch/{batchId}
  polling:
    interval: 5s
    maxAttempts: 180

zotero:
  enabled: true
  baseUrl: ${ZOTERO_BASE_URL:http://127.0.0.1:23119}
  requestTimeout: 30s

minio:
  endpoint: http://localhost:9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucketName: literatures
  publicUrl: http://localhost:9000
  storage:
    originalPrefix: uploads/{traceId}/original/
    parsedPrefix: uploads/{traceId}/mineru/

embedding:
  api:
    url: ${EMBEDDING_API_URL:https://api.deepinfra.com/v1/openai}
    key: ${DEEPINFRA_API_TOKEN:${EMBEDDING_API_KEY:}}
    model: ${EMBEDDING_API_MODEL:BAAI/bge-m3}
    batch-size: ${EMBEDDING_API_BATCH_SIZE:10}
    dimension: ${EMBEDDING_API_DIMENSION:1024}
    timeout-seconds: ${EMBEDDING_API_TIMEOUT_SECONDS:30}

elasticsearch:
  index-name: ${ELASTICSEARCH_INDEX_NAME:scholarease_bge_m3}

logging:
  file:
    name: ${LOG_FILE:../logs/scholarease-backend.log}
  level:
    root: INFO
    com.kesf.backend: DEBUG
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
